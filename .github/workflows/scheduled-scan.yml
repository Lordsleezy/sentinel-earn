name: Scheduled Bounty Scan

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run bounty scan
        run: python backend/scripts/run_scheduled_scan.py

      - name: Commit scan log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan-log/
          git diff --staged --quiet && echo "No scan changes" && exit 0
          git commit -m "chore: scheduled bounty scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
